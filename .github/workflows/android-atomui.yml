name: Android (Avalonia + AtomUI)

on:
  push:
    branches: [main, "agent/**"]
    tags: ["atomui-v*"]
    paths:
      - "src/NetworkControl.Core/**"
      - "src/NetworkControl.Storage/**"
      - "src/NetworkControl.Diagnostics/**"
      - "src/NetworkControl.Engine.Vpn/**"
      - "src/NetworkControl.Engine.Android/**"
      - "src/NetworkControl.App.Android/**"
      - ".github/workflows/android-atomui.yml"
  pull_request:
    paths:
      - "src/NetworkControl.Core/**"
      - "src/NetworkControl.Storage/**"
      - "src/NetworkControl.Diagnostics/**"
      - "src/NetworkControl.Engine.Vpn/**"
      - "src/NetworkControl.Engine.Android/**"
      - "src/NetworkControl.App.Android/**"
      - ".github/workflows/android-atomui.yml"
  workflow_dispatch:
    inputs:
      create_release:
        description: "同時發佈 AtomUI APK 到 GitHub Releases"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-atomui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and package AtomUI APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Run Engine.Vpn unit tests
        run: dotnet test --project tests/NetworkControl.Engine.Vpn.Tests/NetworkControl.Engine.Vpn.Tests.csproj -c Release

      - name: Decode release keystore (if configured)
        env:
          NC_ANDROID_KEYSTORE_BASE64: ${{ secrets.NC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$NC_ANDROID_KEYSTORE_BASE64" ]; then
            echo "$NC_ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/pocketgate-release.jks
            echo "NC_ANDROID_KEYSTORE=/tmp/pocketgate-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Publish AtomUI Release APK
        id: meta
        env:
          NC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NC_ANDROID_KEYSTORE_PASSWORD }}
          NC_ANDROID_KEY_ALIAS: ${{ secrets.NC_ANDROID_KEY_ALIAS }}
          NC_ANDROID_KEY_PASSWORD: ${{ secrets.NC_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=(publish src/NetworkControl.App.Android/NetworkControl.App.Android.csproj -c Release -o dist-atomui)
          if [ -n "${NC_ANDROID_KEYSTORE:-}" ]; then
            args+=(
              -p:AndroidKeyStore=true
              "-p:AndroidSigningKeyStore=$NC_ANDROID_KEYSTORE"
              "-p:AndroidSigningKeyAlias=$NC_ANDROID_KEY_ALIAS"
              -p:AndroidSigningStorePass=env:NC_ANDROID_KEYSTORE_PASSWORD
              -p:AndroidSigningKeyPass=env:NC_ANDROID_KEY_PASSWORD
            )
          fi
          dotnet "${args[@]}"
          ver=$(grep -E '<AtomUiVersion>' src/NetworkControl.App.Android/NetworkControl.App.Android.csproj | sed -E 's/.*<AtomUiVersion>([^<]+)<\/AtomUiVersion>.*/\1/')
          signed=$(ls -t dist-atomui/*-Signed.apk | head -n1)
          cp "$signed" "dist-atomui/PocketGate-${ver}-AtomUI.apk"
          sha256sum "dist-atomui/PocketGate-${ver}-AtomUI.apk" > dist-atomui/SHA256SUMS-AtomUI.txt
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PocketGate-AtomUI
          path: |
            dist-atomui/PocketGate-*-AtomUI.apk
            dist-atomui/SHA256SUMS-AtomUI.txt
          retention-days: 30

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('atomui-v{0}', steps.meta.outputs.version) }}
          name: PocketGate ${{ steps.meta.outputs.version }} (AtomUI)
          files: |
            dist-atomui/PocketGate-*-AtomUI.apk
            dist-atomui/SHA256SUMS-AtomUI.txt
          generate_release_notes: true

      - name: Sync APK to Gitee Releases (when GITEE_TOKEN is configured)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'yuexiaobai/PocketGate' }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN secret is not set; skipping Gitee Release sync."
            exit 0
          fi
          tag="atomui-v${VERSION}"
          apk="dist-atomui/PocketGate-${VERSION}-AtomUI.apk"
          repo="${GITEE_REPO}"
          status=$(curl -sS -o /dev/null -w "%{http_code}" "https://gitee.com/api/v5/repos/${repo}?access_token=${GITEE_TOKEN}" || true)
          if [ "$status" = "404" ] && [ "$repo" = "yuexiaobai/PocketGate" ]; then
            repo="yuexiaobai/networkcontrol"
          fi
          resp=$(curl -sS -X POST "https://gitee.com/api/v5/repos/${repo}/releases" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "tag_name=${tag}" \
            -F "target_commitish=main" \
            -F "name=PocketGate ${VERSION} (AtomUI)" \
            -F "body=Automated release for PocketGate ${VERSION} (AtomUI)")
          release_id=$(echo "$resp" | python3 -c "import sys, json; print(json.load(sys.stdin).get('id', ''))" || true)
          if [ -z "$release_id" ]; then
            echo "Release ${tag} may already exist, querying existing releases..."
            release_id=$(curl -sS "https://gitee.com/api/v5/repos/${repo}/releases/tags/${tag}?access_token=${GITEE_TOKEN}" \
              | python3 -c "import sys, json; print(json.load(sys.stdin).get('id', ''))" || true)
          fi
          if [ -n "$release_id" ]; then
            apk_name="$(basename "$apk")"
            existing_ids=$(curl -sS "https://gitee.com/api/v5/repos/${repo}/releases/${release_id}/attach_files?access_token=${GITEE_TOKEN}" \
              | python3 -c "import sys, json; data = json.load(sys.stdin); print('\n'.join(str(x['id']) for x in data if isinstance(x, dict) and x.get('name') == '${apk_name}'))" || true)
            for fid in $existing_ids; do
              echo "Deleting duplicate Gitee attachment ${fid} (${apk_name})..."
              curl -sS -X DELETE "https://gitee.com/api/v5/repos/${repo}/releases/${release_id}/attach_files/${fid}?access_token=${GITEE_TOKEN}" >/dev/null || true
            done
            echo "Uploading ${apk} to Gitee release ${release_id} (${repo})..."
            curl -fsSL -X POST "https://gitee.com/api/v5/repos/${repo}/releases/${release_id}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${apk}" >/dev/null
            echo "Successfully uploaded ${apk} to Gitee Release ${tag}."
          else
            echo "::warning::Could not create or find Gitee release for ${tag}"
          fi
