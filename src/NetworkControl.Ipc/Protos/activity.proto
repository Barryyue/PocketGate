syntax = "proto3";

package netcontrol.v1;

option csharp_namespace = "NetworkControl.Ipc.V1";

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common.proto";

// 連接日誌與實時事件。
service ActivityLog {
  rpc QueryLog (LogQuery) returns (LogPage);
  rpc WatchConnections (google.protobuf.Empty) returns (stream ConnectionEvent);
  // 一段時間內的連接統計（總覽儀表板、應用頁）。
  rpc GetSummary (SummaryQuery) returns (SummaryReply);
  // 一段時間內的流量（FR-STA-01）：時間軸和用量最大的應用。查詢條件與 GetSummary 相同。
  rpc GetTraffic (SummaryQuery) returns (TrafficReply);
}

message LogQuery {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  optional int64 app_id = 3;
  optional VerdictAction action = 4;
  optional string keyword = 5;
  int32 limit = 6;
  optional int64 before_id = 7;
}

message LogEntry {
  int64 id = 1;
  google.protobuf.Timestamp first_seen = 2;
  google.protobuf.Timestamp last_seen = 3;
  optional int64 app_id = 4;
  optional string app_path = 5;
  optional string app_name = 6;
  Direction direction = 7;
  Protocol protocol = 8;
  IpEndpoint remote = 9;
  optional string hostname = 10;
  Verdict verdict = 11;
  int32 count = 12;
}

message LogPage {
  repeated LogEntry entries = 1;
}

message SummaryQuery {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  // 時間軸分桶大小，至少 1 分鐘。
  google.protobuf.Duration bucket = 3;
  int32 top_count = 4;
}

message SummaryBucket {
  google.protobuf.Timestamp start = 1;
  int64 allowed = 2;
  int64 blocked = 3;
}

message SummaryItem {
  // 應用為 "app:<id>" 或 "path:<路徑>"；目標為域名或 IP。
  string key = 1;
  optional string label = 2;
  optional int64 app_id = 3;
  int64 allowed = 4;
  int64 blocked = 5;
  // 應用的可執行文件路徑（目標條目為空）。
  optional string path = 6;
}

message SummaryReply {
  int64 allowed = 1;
  int64 blocked = 2;
  int32 app_count = 3;
  int32 destination_count = 4;
  repeated SummaryBucket timeline = 5;
  repeated SummaryItem top_apps = 6;
  repeated SummaryItem top_destinations = 7;
}

message TrafficBucket {
  google.protobuf.Timestamp start = 1;
  int64 bytes_in = 2;
  int64 bytes_out = 3;
}

message TrafficItem {
  // 無法識別的應用為 -1。
  int64 app_id = 1;
  string display_name = 2;
  string path = 3;
  int64 bytes_in = 4;
  int64 bytes_out = 5;
}

message TrafficReply {
  int64 bytes_in = 1;
  int64 bytes_out = 2;
  repeated TrafficBucket timeline = 3;
  repeated TrafficItem top_apps = 4;
  // 引擎能否提供流量數據（例如 WFP 未啟用流量採集時為 false，界面據此提示）。
  bool available = 5;
}

message ConnectionEvent {
  google.protobuf.Timestamp timestamp = 1;
  optional int64 app_id = 2;
  optional string app_path = 3;
  optional string app_name = 4;
  Direction direction = 5;
  Protocol protocol = 6;
  IpEndpoint local = 7;
  IpEndpoint remote = 8;
  optional string hostname = 9;
  Verdict verdict = 10;
}
