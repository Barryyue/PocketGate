name: Android (Kotlin)

on:
  push:
    branches: [main, "agent/**"]
    tags: ["kt-v*", "v*"]
    paths:
      - "android-kotlin/**"
      - "!android-kotlin/*.md"
      - ".github/workflows/android-kotlin.yml"
  pull_request:
    paths:
      - "android-kotlin/**"
      - "!android-kotlin/*.md"
      - ".github/workflows/android-kotlin.yml"
  workflow_dispatch:
    inputs:
      create_release:
        description: "同時發佈到 GitHub Releases（供 App 內檢查更新直接下載）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and package APK
    runs-on: ubuntu-latest
    env:
      # arm64 安裝包的體積上限（bytes）。加入 Glance 掛件與 Haze 模糊後約 5.6 MB；超過 6.5 MB 代表引入了大依賴或資源，需要先評估。
      APK_SIZE_BUDGET: "6500000"
    defaults:
      run:
        working-directory: android-kotlin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: bash gradlew testDebugUnitTest --no-daemon

      - name: Decode release keystore (if configured)
        env:
          NC_ANDROID_KEYSTORE_BASE64: ${{ secrets.NC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$NC_ANDROID_KEYSTORE_BASE64" ]; then
            echo "$NC_ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/pocketgate-release.jks
            echo "NC_ANDROID_KEYSTORE=/tmp/pocketgate-release.jks" >> "$GITHUB_ENV"
            echo "Using official release keystore from GitHub Secrets."
          else
            echo "NC_ANDROID_KEYSTORE_BASE64 not set; falling back to shared keystore."
          fi

      - name: Release APKs (per ABI)
        env:
          NC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NC_ANDROID_KEYSTORE_PASSWORD }}
          NC_ANDROID_KEY_ALIAS: ${{ secrets.NC_ANDROID_KEY_ALIAS }}
          NC_ANDROID_KEY_PASSWORD: ${{ secrets.NC_ANDROID_KEY_PASSWORD }}
        run: bash gradlew assembleRelease --no-daemon

      - name: Size report, budget check and rename APKs
        id: meta
        run: |
          set -euo pipefail
          version=$(grep -E 'versionName\s*=\s*"' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          dir=app/build/outputs/apk/release
          mkdir -p dist
          cp "$dir/app-arm64-v8a-release.apk" "dist/PocketGate-${version}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

          echo "### PocketGate ${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK | bytes | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            size=$(stat -c %s "$apk")
            hash=$(sha256sum "$apk" | awk '{print $1}')
            echo "| $(basename "$apk") | $size | \`$hash\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          arm64="$dir/app-arm64-v8a-release.apk"
          size=$(stat -c %s "$arm64")
          echo "arm64 APK: $size bytes (budget $APK_SIZE_BUDGET)"
          unzip -l "$arm64" | awk '$4 ~ /(\.dex|\.so|resources\.arsc|baseline\.prof)$/ {print $1, $4}'
          if [ "$size" -gt "$APK_SIZE_BUDGET" ]; then
            echo "::error::arm64 APK is $size bytes, over the budget of $APK_SIZE_BUDGET"
            exit 1
          fi
          unzip -l "$arm64" | grep -q "assets/dexopt/baseline.prof" || { echo "::error::baseline.prof missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: PocketGate-${{ steps.meta.outputs.version }}
          path: |
            android-kotlin/dist/*.apk
            android-kotlin/dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: PocketGate ${{ steps.meta.outputs.version }}
          files: |
            android-kotlin/dist/*.apk
            android-kotlin/dist/SHA256SUMS.txt
          generate_release_notes: true

      - name: Sync APK to Gitee Releases (when GITEE_TOKEN is configured)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'yuexiaobai/PocketGate' }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN secret is not set; skipping Gitee Release sync."
            exit 0
          fi
          tag="v${VERSION}"
          apk="dist/PocketGate-${VERSION}.apk"
          repo="${GITEE_REPO}"
          status=$(curl -sS -o /dev/null -w "%{http_code}" "https://gitee.com/api/v5/repos/${repo}?access_token=${GITEE_TOKEN}" || true)
          if [ "$status" = "404" ] && [ "$repo" = "yuexiaobai/PocketGate" ]; then
            repo="yuexiaobai/networkcontrol"
          fi
          git push "https://oauth2:${GITEE_TOKEN}@gitee.com/${repo}.git" HEAD:refs/heads/main || true
          resp=$(curl -sS -X POST "https://gitee.com/api/v5/repos/${repo}/releases" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "tag_name=${tag}" \
            -F "target_commitish=main" \
            -F "name=PocketGate ${VERSION}" \
            -F "body=Automated release for PocketGate ${VERSION}")
          release_id=$(echo "$resp" | python3 -c "import sys, json; print(json.load(sys.stdin).get('id', ''))" || true)
          if [ -z "$release_id" ]; then
            echo "Release ${tag} may already exist, querying existing releases..."
            release_id=$(curl -sS "https://gitee.com/api/v5/repos/${repo}/releases/tags/${tag}?access_token=${GITEE_TOKEN}" \
              | python3 -c "import sys, json; print(json.load(sys.stdin).get('id', ''))" || true)
          fi
          if [ -n "$release_id" ]; then
            apk_name="$(basename "$apk")"
            existing_ids=$(curl -sS "https://gitee.com/api/v5/repos/${repo}/releases/${release_id}/attach_files?access_token=${GITEE_TOKEN}" \
              | python3 -c "import sys, json; data = json.load(sys.stdin); print('\n'.join(str(x['id']) for x in data if isinstance(x, dict) and x.get('name') == '${apk_name}'))" || true)
            for fid in $existing_ids; do
              echo "Deleting duplicate Gitee attachment ${fid} (${apk_name})..."
              curl -sS -X DELETE "https://gitee.com/api/v5/repos/${repo}/releases/${release_id}/attach_files/${fid}?access_token=${GITEE_TOKEN}" >/dev/null || true
            done
            echo "Uploading ${apk} to Gitee release ${release_id} (${repo})..."
            curl -fsSL -X POST "https://gitee.com/api/v5/repos/${repo}/releases/${release_id}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${apk}" >/dev/null
            echo "Successfully uploaded ${apk} to Gitee Release ${tag}."
          else
            echo "::warning::Could not create or find Gitee release for ${tag}"
          fi
