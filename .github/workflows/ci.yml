name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "NetworkControl*.slnx"
      - "Directory.*"
      - "global.json"
      - ".editorconfig"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "NetworkControl*.slnx"
      - "Directory.*"
      - "global.json"
      - ".editorconfig"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NetworkControl.slnx

      - name: Verify formatting
        if: runner.os == 'Linux'
        # Android 項目在解決方案中只用於 IDE 瀏覽（不參與構建），沒有 Android 工作負載時無法分析，格式由 android 任務檢查
        run: dotnet format NetworkControl.slnx --verify-no-changes --no-restore --exclude src/NetworkControl.App.Android src/NetworkControl.Engine.Android

      - name: Build
        run: dotnet build NetworkControl.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution NetworkControl.slnx --configuration Release --no-build

  # Android 版（docs/android.md）：Core / Storage 被 Android 共用，改動它們可能讓 Android 項目編譯失敗，
  # 而主解決方案不包含 Android 項目，因此單獨構建 NetworkControl.Android.slnx 及早發現。
  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK components
        run: >-
          dotnet build src/NetworkControl.App.Android/NetworkControl.App.Android.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=true

      - name: Verify formatting
        run: dotnet format NetworkControl.Android.slnx --verify-no-changes

      - name: Build
        run: dotnet build NetworkControl.Android.slnx --configuration Debug -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
