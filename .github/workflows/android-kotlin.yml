name: Android (Kotlin)

on:
  push:
    branches: [main]
    paths:
      - "android-kotlin/**"
      - ".github/workflows/android-kotlin.yml"
  pull_request:
    paths:
      - "android-kotlin/**"
      - ".github/workflows/android-kotlin.yml"

permissions:
  contents: read

concurrency:
  group: android-kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and size check
    runs-on: ubuntu-latest
    env:
      # arm64 安裝包的體積上限（bytes）。目前約 4.3 MB；超過 5.5 MB 代表引入了大依賴或資源，需要先評估。
      APK_SIZE_BUDGET: "5500000"
    defaults:
      run:
        working-directory: android-kotlin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: bash gradlew testDebugUnitTest --no-daemon

      - name: Release APKs (per ABI)
        run: bash gradlew assembleRelease --no-daemon

      - name: Size report and budget
        run: |
          set -euo pipefail
          dir=app/build/outputs/apk/release
          echo "| APK | bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for apk in "$dir"/*.apk; do
            size=$(stat -c %s "$apk")
            echo "| $(basename "$apk") | $size |" >> "$GITHUB_STEP_SUMMARY"
          done
          arm64="$dir/app-arm64-v8a-release.apk"
          size=$(stat -c %s "$arm64")
          echo "arm64 APK: $size bytes (budget $APK_SIZE_BUDGET)"
          # 主要組成，方便比較體積變化
          unzip -l "$arm64" | awk '$4 ~ /(\.dex|\.so|resources\.arsc|baseline\.prof)$/ {print $1, $4}'
          if [ "$size" -gt "$APK_SIZE_BUDGET" ]; then
            echo "::error::arm64 APK is $size bytes, over the budget of $APK_SIZE_BUDGET"
            exit 1
          fi
          # Baseline Profile 必須在安裝包裡（profileinstaller 依它預先編譯啟動路徑）
          unzip -l "$arm64" | grep -q "assets/dexopt/baseline.prof" || { echo "::error::baseline.prof missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: android-kotlin/app/build/outputs/apk/release/*.apk
          retention-days: 7
