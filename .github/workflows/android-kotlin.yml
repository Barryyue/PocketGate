name: Android (Kotlin)

on:
  push:
    branches: [main, "agent/**"]
    tags: ["kt-v*", "v*"]
    paths:
      - "android-kotlin/**"
      - ".github/workflows/android-kotlin.yml"
  pull_request:
    paths:
      - "android-kotlin/**"
      - ".github/workflows/android-kotlin.yml"
  workflow_dispatch:
    inputs:
      create_release:
        description: "同時發佈到 GitHub Releases（供 App 內檢查更新直接下載）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and package APK
    runs-on: ubuntu-latest
    env:
      # arm64 安裝包的體積上限（bytes）。加入 Glance 掛件與 Haze 模糊後約 5.6 MB；超過 6.5 MB 代表引入了大依賴或資源，需要先評估。
      APK_SIZE_BUDGET: "6500000"
    defaults:
      run:
        working-directory: android-kotlin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: bash gradlew testDebugUnitTest --no-daemon

      - name: Release APKs (per ABI)
        run: bash gradlew assembleRelease --no-daemon

      - name: Size report, budget check and rename APKs
        id: meta
        run: |
          set -euo pipefail
          version=$(grep -E 'versionName\s*=\s*"' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          dir=app/build/outputs/apk/release
          mkdir -p dist
          cp "$dir/app-arm64-v8a-release.apk" "dist/NetworkControl-KT-${version}.apk"
          cp "$dir/app-x86_64-release.apk" "dist/NetworkControl-KT-${version}-x86_64-emulator.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

          echo "### NetworkControl KT ${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "| APK | bytes | SHA-256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            size=$(stat -c %s "$apk")
            hash=$(sha256sum "$apk" | awk '{print $1}')
            echo "| $(basename "$apk") | $size | \`$hash\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          arm64="$dir/app-arm64-v8a-release.apk"
          size=$(stat -c %s "$arm64")
          echo "arm64 APK: $size bytes (budget $APK_SIZE_BUDGET)"
          unzip -l "$arm64" | awk '$4 ~ /(\.dex|\.so|resources\.arsc|baseline\.prof)$/ {print $1, $4}'
          if [ "$size" -gt "$APK_SIZE_BUDGET" ]; then
            echo "::error::arm64 APK is $size bytes, over the budget of $APK_SIZE_BUDGET"
            exit 1
          fi
          unzip -l "$arm64" | grep -q "assets/dexopt/baseline.prof" || { echo "::error::baseline.prof missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: NetworkControl-KT-${{ steps.meta.outputs.version }}
          path: |
            android-kotlin/dist/*.apk
            android-kotlin/dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('kt-v{0}', steps.meta.outputs.version) }}
          name: NetworkControl KT ${{ steps.meta.outputs.version }}
          files: |
            android-kotlin/dist/*.apk
            android-kotlin/dist/SHA256SUMS.txt
          generate_release_notes: true
